site_name: Camp Bruchési
site_description: Documentation officielle du Camp Bruchési
site_url: https://ndelorimier.github.io/vault-camp-bruchesi/
repo_url: https://github.com/ndelorimier/vault-camp-bruchesi
repo_name: vault-camp-bruchesi

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: fr

nav:
  - Accueil: index.md
  - Séjours:
    - Vue d'ensemble: sejours/index.md
    - Calendrier: sejours/calendrier.md
    - Inscription: sejours/inscription.md
  - Services:
    - Vue d'ensemble: services/index.md
    - Hébergement: services/hebergement.md
    - Activités: services/activites.md
    - Restauration: services/restauration.md
  - FAQ: faq.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ndelorimier/vault-camp-bruchesi

copyright: Copyright &copy; 2026 Camp Bruchési
