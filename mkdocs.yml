site_name: Camp Bruchési
site_description: Documentation officielle du Camp Bruchési
site_url: https://ndelorimier.github.io/vault-camp-bruchesi/
repo_url: https://github.com/ndelorimier/vault-camp-bruchesi
repo_name: vault-camp-bruchesi

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: fr

nav:
  - Accueil: index.md
  - Séjours:
    - Vue d'ensemble: sejours/index.md
    - Calendrier 2026: sejours/calendrier.md
    - Tarifs et inscription: sejours/inscription.md
    - Transport: sejours/transport.md
    - Quoi apporter: sejours/quoi-apporter.md
    - Groupes scolaires: sejours/groupes-scolaires.md
    - Accueil corporatif: sejours/corporatif.md
    - Accessibilité financière: sejours/accessibilite.md
    - Emploi: sejours/emploi.md
    - Mission et valeurs: sejours/mission-valeurs.md
  - Services:
    - Vue d'ensemble: services/index.md
    - Hébergement: services/hebergement.md
    - Activités: services/activites.md
    - Restauration: services/restauration.md
  - FAQ: faq.md
  - Contact: contact.md
  - Intégrations:
    - Zoom Virtual Agent (chat): integration/zoom-virtual-agent.md
    - Réceptionniste IA (téléphone): integration/ai-receptionist-telephone.md
  - Formation (Staff):
    - Vue d'ensemble: formation/index.md
    - Guide nouvel animateur: formation/nouveau-animateur.md
    - Code d'éthique: formation/code-ethique.md
    - Protocoles:
      - Urgences et sécurité: formation/protocoles/urgences.md
      - Signalement d'abus: formation/protocoles/signalement.md
      - Santé et médicaments: formation/protocoles/sante.md
      - Garde de nuit: formation/protocoles/garde-nuit.md
    - Ressources d'aide: formation/ressources-aide.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ndelorimier/vault-camp-bruchesi

copyright: Copyright &copy; 2026 Camp Bruchési
